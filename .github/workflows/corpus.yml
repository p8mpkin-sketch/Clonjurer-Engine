name: real-site-corpus

# 真实站点语料跑分: 在 GitHub 托管 runner 上起一个平台实例(有国际网络), 跑
# engine_bench/real_sites/run_corpus.py, 报告写进本次运行的摘要并上传明细。
# 引擎改动的 PR 与每晚默认只跑 global 标签: runner 在美国, 国内站会拿到地区版/风控页
# (实测 aliyun/jd/mi 与国内直连差异巨大), 国内站在 cz 本机实例上跑 --tag cn。
# 手动触发可填 tag(留空=global, 可填 cn 等)或 sites(覆盖语料)。
# 不作门槛(真实站点会变), 只做度量留档; 跟上一轮的对比看报告 Δ 列(本地 runs/)或下载两次产物比。
on:
  pull_request:
    paths:
      - "core/**"
      - "config.py"
      - "engine_bench/real_sites/**"
      - ".github/workflows/corpus.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "只跑带此标签的站(留空=global; cn=国内站)"
        required: false
        default: ""
      sites:
        description: "逗号分隔 URL, 覆盖语料(可选)"
        required: false
        default: ""
      engine_env:
        description: "实例环境变量(空格分隔 K=V, 同时段 A/B 用, 如 CLONER_FONT_PLAN=0)"
        required: false
        default: ""
      viewports:
        description: "探针视口(留空=desktop,tablet,mobile; 可填 phones / phones4 / iphone-air,galaxy-s24 等)"
        required: false
        default: ""
      probe_noise:
        description: "探针加原站自比上限与稳健口径(true/false)"
        required: false
        default: "false"
      probe_each:
        description: "每站克隆一完成立即探针(true/false)"
        required: false
        default: "false"
      shots:
        description: "低分站截图(base64)进日志(true/false; 远程只读日志尾部归因时填 false)"
        required: false
        default: "true"
      dump_src:
        description: "原站源码与克隆首页(各前 40KB)进日志(true/false; 配合 sites 做单站归因)"
        required: false
        default: "false"
  schedule:
    - cron: "30 18 * * *"   # 北京时间 02:30

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖与 Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: 启动平台实例(开放模式, 无用户)
        run: |
          mkdir -p logs
          env CLONER_PORT=8897 ${{ github.event.inputs.engine_env }} nohup python app.py > logs/app_ci.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8897/api/auth/state && exit 0
            sleep 1
          done
          echo "实例未就绪"; tail -50 logs/app_ci.log; exit 1
      - name: 跑语料
        run: |
          extra=""
          [ "${{ github.event.inputs.probe_noise }}" = "true" ] && extra="$extra --probe-noise"
          [ "${{ github.event.inputs.probe_each }}" = "true" ] && extra="$extra --probe-each"
          python engine_bench/real_sites/run_corpus.py --base http://127.0.0.1:8897 \
            --timeout 3600 --tag "${{ github.event.inputs.tag || 'global' }}" \
            --sites "${{ github.event.inputs.sites }}" \
            --viewports "${{ github.event.inputs.viewports || 'desktop,tablet,mobile' }}" $extra \
            || echo "有站点未完成(报告照常产出)"
      - name: 报告写入运行摘要
        if: always()
        run: |
          f=$(ls -t engine_bench/real_sites/runs/REPORT_*.md 2>/dev/null | head -1)
          if [ -n "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; cat "$f"; fi
          j=$(ls -t engine_bench/real_sites/runs/run_*.json 2>/dev/null | head -1)
          # 明细也进日志: 产物存储域名在部分环境不可达, 日志总能读到
          if [ -n "$j" ]; then echo "::group::run json"; cat "$j"; echo "::endgroup::"; fi
          # 未出分/失败/低于 90 分站点的任务日志(engine.log)尾部进日志, 供远程归因
          if [ -n "$j" ]; then
            CORPUS_SHOTS="${{ github.event.inputs.shots || 'true' }}" python - "$j" <<'PY'
          import json, os, sys, pathlib
          run = json.load(open(sys.argv[1], encoding="utf-8"))
          SHOTS = os.environ.get("CORPUS_SHOTS", "true") != "false"
          def _low_vps(r):
              # 视口探针分(有稳健口径时看稳健分)低于 85 的视口: 这些宽度的原站/克隆截图进日志
              vp = dict(r.get("vp") or {})
              for k, v in (r.get("vp_robust") or {}).items():
                  if v is not None:
                      vp[k] = v
              return [k for k, v in vp.items() if isinstance(v, (int, float)) and v < 85]
          def _shot(path, tag, width=480, max_h=2400):
              if not SHOTS:
                  return
              try:
                  from PIL import Image
                  import base64, io
                  im = Image.open(path).convert("RGB")
                  im = im.resize((width, max(1, round(im.height * width / im.width))))
                  im = im.crop((0, 0, width, min(im.height, max_h)))
                  buf = io.BytesIO(); im.save(buf, "JPEG", quality=60)
                  print(f"::group::shot {tag}")
                  b64 = base64.b64encode(buf.getvalue()).decode()
                  for k in range(0, len(b64), 4000):
                      print("SHOT64:" + b64[k:k + 4000])
                  print("::endgroup::")
              except Exception as exc:
                  print(f"(缩略图失败 {path}: {exc})")
          vp_dirs = sorted(pathlib.Path("engine_bench/real_sites/runs").glob("viewports_*"))
          for r in run.get("results", []):
              low = _low_vps(r)
              for v, d in (r.get("vp_diag") or {}).items():
                  print(f"::group::vp-diag {r.get('task_id')} {v} {r.get('url')}")
                  for side in ("clone", "orig"):
                      dd = d.get(side) or {}
                      print(f"[{side}] 图 {dd.get('nimg')} 张, 裂图 {len(dd.get('broken') or [])}, 失败请求 {len(dd.get('failed') or [])}, 脚本错误 {len(dd.get('errors') or [])}")
                      for b in (dd.get("broken") or [])[:20]: print("  裂图", b)
                      for f in (dd.get("failed") or [])[:30]: print("  失败", f)
                      for e in (dd.get("errors") or [])[:5]: print("  错误", e)
                      for e in (dd.get("exceptions") or [])[:6]: print("  异常定位", e)
                      for sh in (dd.get("sheets") or [])[:40]: print("  样式表", sh)
                      for k, v in (dd.get("probe") or {}).items(): print(f"  探 {k}: {v}")
                      for ov in (dd.get("overlays") or [])[:12]: print("  盖屏层", ov)
                      for hi in (dd.get("hiddenInputs") or [])[:12]: print("  隐藏控件", hi)
                      for st in (dd.get("styles") or [])[:60]: print("  style块", st)
                  # 可见文本行做差(忽略坐标): 原站有克隆没有 = 丢的表单/计数/文案; 反向 = 克隆多出的弹层/占位
                  key = lambda l: l.rsplit(" @", 1)[0]
                  co = {key(l): l for l in ((d.get("clone") or {}).get("lines") or [])}
                  oo = {key(l): l for l in ((d.get("orig") or {}).get("lines") or [])}
                  for l in [oo[k] for k in oo if k not in co][:14]: print("  原站独有文本", l)
                  for l in [co[k] for k in co if k not in oo][:14]: print("  克隆独有文本", l)
                  # 同一段文案两侧都有但纵向位置差 >40px: 从第一处位移看出哪一块高度/有无不同
                  ypos = lambda l: int(l.rsplit(" @", 1)[1].split(",")[0]) if " @" in l else 0
                  moved = [(ypos(oo[k]), ypos(co[k]), k) for k in oo if k in co and abs(ypos(oo[k]) - ypos(co[k])) > 40]
                  for oy, cy, k in sorted(moved)[:12]: print(f"  位移文本 原 y={oy} 克隆 y={cy}: {k[:70]}")
                  print("::endgroup::")
              # 低分视口的探针截图(原站/克隆/遮罩后)进日志: 产物存储域名在部分环境不可达
              for v in low:
                  for kind in ("orig", "clone", "orig_rb", "clone_rb"):
                      for d in vp_dirs:
                          f = d / f"{r.get('task_id')}_{v}_{kind}.png"
                          if f.is_file():
                              _shot(f, f"{r.get('task_id')} vp {v} {kind} {r.get('url')}", width=300, max_h=5200)
                              break
              # 慢站(>120s)也打日志: 远程做耗时归因
              # 交互轨(可交互交付物)低于 90 的站同样打日志: 头条分被保真轨托住时交互轨塌陷也要能远程归因
              inter = r.get("interactive")
              if r.get("status") == "completed" and isinstance(r.get("score"), (int, float)) and r["score"] >= 90 and not low \
                      and (r.get("elapsed_s") or 0) <= 120 and not (isinstance(inter, (int, float)) and inter < 90):
                  continue
              log = pathlib.Path("workspaces") / str(r.get("task_id")) / "engine.log"
              print(f"::group::engine.log {r.get('url')} ({r.get('status')})")
              keep = [l for l in (log.read_text(encoding="utf-8").splitlines() if log.is_file() else [])
                      if not any(k in l for k in ("[CAS-", "跳过 http", "] 录制 "))]
              print("\n".join(keep[-250:]) if keep else "(无 engine.log)")
              print("::endgroup::")
              # 文本差: 原站有而克隆缺的行(文本召回低时定位缺什么)
              ot, ct = log.parent / "original_text.txt", log.parent / "cloned_text.txt"
              if ot.is_file() and ct.is_file():
                  have = set(l.strip() for l in ct.read_text(encoding="utf-8", errors="replace").splitlines())
                  miss = [l.strip() for l in ot.read_text(encoding="utf-8", errors="replace").splitlines()
                          if l.strip() and l.strip() not in have]
                  print(f"::group::text-miss {r.get('task_id')} ({len(miss)} 行缺失)")
                  print("\n".join(m[:160] for m in miss[:60]))
                  print("::endgroup::")
              # 预览缩略图(base64 JPEG)进日志: 产物下载在部分环境不可达, 远程看图归因
              try:
                  from PIL import Image
                  import base64, io
                  for name in (("original_preview.png", "cloned_preview.png", "fidelity_preview.png") if SHOTS else ()):
                      f = log.parent / name
                      if not f.is_file():
                          continue
                      im = Image.open(f).convert("RGB")
                      im = im.resize((480, max(1, round(im.height * 480 / im.width))))
                      im = im.crop((0, 0, 480, min(im.height, 2400)))
                      buf = io.BytesIO(); im.save(buf, "JPEG", quality=60)
                      print(f"::group::shot {r.get('task_id')} {name}")
                      b64 = base64.b64encode(buf.getvalue()).decode()
                      for k in range(0, len(b64), 4000):
                          print("SHOT64:" + b64[k:k + 4000])
                      print("::endgroup::")
              except Exception as exc:
                  print(f"(缩略图失败: {exc})")
          PY
          fi
      - name: 原站源码与克隆首页进日志(单站归因)
        if: always() && github.event.inputs.dump_src == 'true' && github.event.inputs.sites != ''
        run: |
          IFS=',' read -ra urls <<< "${{ github.event.inputs.sites }}"
          for u in "${urls[@]}"; do
            echo "::group::SRC $u"
            curl -sL -m 20 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" "$u" | head -c 40000 || true
            echo; echo "::endgroup::"
          done
          for d in workspaces/*/; do
            for f in index.html index.interactive.html; do
              [ -f "$d/$f" ] || continue
              echo "::group::CLONE $d$f"
              head -c 40000 "$d/$f"
              echo; echo "::endgroup::"
            done
          done
      - name: 上传报告与实例日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: |
            engine_bench/real_sites/runs/
            logs/app_ci.log
          if-no-files-found: ignore
      - name: 未完成任务的日志尾部(卡死归因)
        if: always()
        run: |
          for d in workspaces/*/; do
            [ -f "$d/engine.log" ] || continue
            grep -q "完成, 耗时\|任务失败\|失败:" "$d/engine.log" && continue
            echo "::group::UNFINISHED $d"
            tail -30 "$d/engine.log"
            [ -f "$d/engine.diag" ] && { echo "--- engine.diag"; tail -15 "$d/engine.diag"; }
            echo "::endgroup::"
          done
      - name: 紧凑摘要(日志尾部, 远程归因只拉最后 150 行即可)
        if: always()
        run: |
          j=$(ls -t engine_bench/real_sites/runs/run_*.json 2>/dev/null | head -1)
          [ -n "$j" ] || exit 0
          python - "$j" <<'PY'
          import json, sys
          run = json.load(open(sys.argv[1], encoding="utf-8"))
          print("COMPACT env=" + "${{ github.event.inputs.engine_env }}".replace(" ", ","))
          for r in run.get("results", []):
              st = r.get("stage_times") or {}
              ph = r.get("phase_times") or {}
              print("COMPACT|{}|score={}|int={}|el={}|MB={}|n={}|nav={}|lazy={}|cas={}|bf={}|rw={}|dom={}".format(
                  (r.get("url") or "")[8:48], r.get("score"), r.get("interactive"), r.get("elapsed_s"),
                  round((r.get("bytes") or 0) / 1048576, 1), r.get("assets"),
                  ph.get("采集-导航"), ph.get("采集-懒加载滚动"), st.get("CAS并发下载"),
                  st.get("活体回补"), st.get("资源重写"), st.get("DOM渲染")))
          s = run.get("summary") or {}
          print("COMPACT summary " + json.dumps({k: s.get(k) for k in ("mean", "interactive_mean", "mean_elapsed", "p50_elapsed", "p90_elapsed")}, ensure_ascii=False))
          PY
