<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳动的心</title>
<style>
  :root{
    --bg-deep:#0b0a10;
    --bg-warm:#1a0f1c;
    --heart-main:#ff3b5c;
    --heart-light:#ff8fa3;
    --text-warm:#f5e6e8;
    --heart-shadow:#3a1f2b;
    --beat:1.6s;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg-deep);
  }

  body{
    font-family:"Inter","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text-warm);
    -webkit-font-smoothing:antialiased;
    position:relative;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- 背景氛围层 ---------- */
  .stage{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .bg-glow{
    position:absolute;
    left:50%;
    top:50%;
    width:min(140vh,140vw);
    height:min(140vh,140vw);
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 50%,
      rgba(255,59,92,0.16) 0%,
      rgba(122,26,50,0.12) 22%,
      rgba(58,31,43,0.10) 40%,
      rgba(26,15,28,0.55) 62%,
      rgba(11,10,16,0) 78%);
    animation:glowPulse var(--beat) ease-out infinite;
    pointer-events:none;
    will-change:transform,opacity;
  }

  @keyframes glowPulse{
    0%   {transform:translate(-50%,-50%) scale(0.92); opacity:0.75;}
    8%   {transform:translate(-50%,-50%) scale(1.06); opacity:1;}
    18%  {transform:translate(-50%,-50%) scale(1.10); opacity:1;}
    32%  {transform:translate(-50%,-50%) scale(0.98); opacity:0.82;}
    40%  {transform:translate(-50%,-50%) scale(1.02); opacity:0.88;}
    45%  {transform:translate(-50%,-50%) scale(0.96); opacity:0.78;}
    100% {transform:translate(-50%,-50%) scale(0.92); opacity:0.75;}
  }

  .noise{
    position:absolute;
    inset:-10%;
    opacity:0.055;
    pointer-events:none;
    mix-blend-mode:screen;
    animation:noiseDrift 26s linear infinite;
  }
  @keyframes noiseDrift{
    0%{transform:translate3d(0,0,0) scale(1.05);}
    50%{transform:translate3d(-2.5%,1.8%,0) scale(1.12);}
    100%{transform:translate3d(0,0,0) scale(1.05);}
  }

  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,
      rgba(0,0,0,0) 40%,
      rgba(0,0,0,0.35) 78%,
      rgba(0,0,0,0.68) 100%);
  }

  /* ---------- 顶部文字层 ---------- */
  .header{
    position:absolute;
    top:8vh;
    left:0;
    right:0;
    text-align:center;
    z-index:5;
    pointer-events:none;
    padding:0 20px;
  }

  .title{
    font-family:"Noto Serif SC",Georgia,"Songti SC","STSong",serif;
    font-weight:600;
    font-size:clamp(28px,4vw,44px);
    letter-spacing:0.12em;
    color:var(--text-warm);
    text-shadow:0 0 32px rgba(255,59,92,0.22),0 2px 14px rgba(0,0,0,0.6);
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
  }
  .title span{
    display:inline-block;
    opacity:0;
    transform:translateY(26px);
    animation:charRise 0.9s cubic-bezier(.16,.84,.32,1) forwards;
  }
  @keyframes charRise{
    0%{opacity:0;transform:translateY(26px) scale(0.96);filter:blur(4px);}
    100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
  }

  .subtitle{
    margin-top:14px;
    font-size:clamp(10px,1.1vw,13px);
    letter-spacing:0.42em;
    text-transform:uppercase;
    color:rgba(245,230,232,0.5);
    opacity:0;
    animation:subFade 1.1s ease-out 0.85s forwards;
  }
  @keyframes subFade{
    0%{opacity:0;transform:translateY(12px);}
    100%{opacity:1;transform:translateY(0);}
  }

  /* ---------- 主体：心形 + 波纹 ---------- */
  .heart-zone{
    position:relative;
    z-index:3;
    width:min(62vh,80vw);
    height:min(62vh,80vw);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    margin-top:2vh;
  }
  @media (min-width:900px){
    .heart-zone{width:min(66vh,58vw);height:min(66vh,58vw);}
  }

  .ring{
    position:absolute;
    left:50%;
    top:50%;
    width:64%;
    height:64%;
    margin-left:-32%;
    margin-top:-32%;
    border-radius:50%;
    border:1.5px solid rgba(255,143,163,0.55);
    box-shadow:0 0 22px rgba(255,59,92,0.28) inset,0 0 18px rgba(255,59,92,0.18);
    opacity:0;
    transform:scale(0.9);
    pointer-events:none;
    animation:ripple var(--beat) cubic-bezier(.16,.7,.4,1) infinite;
    will-change:transform,opacity;
  }
  .ring.r2{
    animation-delay:0.25s;
    border-color:rgba(255,59,92,0.4);
  }
  @keyframes ripple{
    0%   {transform:scale(0.92); opacity:0;}
    6%   {transform:scale(1.0);  opacity:0.5;}
    30%  {transform:scale(1.55); opacity:0.22;}
    70%  {transform:scale(2.0);  opacity:0.06;}
    100% {transform:scale(2.2);  opacity:0;}
  }

  .heart-wrap{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    transform-origin:50% 55%;
    animation:heartbeat var(--beat) linear infinite, heartEnter 1.15s cubic-bezier(.2,.9,.3,1) both;
    will-change:transform;
  }

  @keyframes heartbeat{
    0%   {transform:scale(1);}
    6%   {transform:scale(1.075);}
    18%  {transform:scale(1.12);}
    26%  {transform:scale(1.035);}
    32%  {transform:scale(1.0);}
    37%  {transform:scale(1.045);}
    41%  {transform:scale(1.06);}
    45%  {transform:scale(1.0);}
    100% {transform:scale(1);}
  }

  @keyframes heartEnter{
    0%   {opacity:0; transform:scale(0.2); filter:blur(10px);}
    60%  {opacity:1; filter:blur(0);}
    100% {opacity:1; transform:scale(1); filter:blur(0);}
  }

  .heart-wrap.manual{
    animation:heartbeat var(--beat) linear infinite, heartEnter 1.15s cubic-bezier(.2,.9,.3,1) both, manualBeat 0.55s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes manualBeat{
    0%{transform:scale(1);}
    22%{transform:scale(1.16);}
    55%{transform:scale(0.97);}
    100%{transform:scale(1);}
  }

  .heart-svg{
    width:100%;
    height:100%;
    overflow:visible;
    filter:drop-shadow(0 0 34px rgba(255,59,92,0.42)) drop-shadow(0 18px 40px rgba(0,0,0,0.55));
  }

  .heart-svg .sheen{
    animation:sheen var(--beat) ease-in-out infinite;
  }
  @keyframes sheen{
    0%   {opacity:0.55;}
    10%  {opacity:1;}
    20%  {opacity:0.92;}
    45%  {opacity:0.5;}
    100% {opacity:0.55;}
  }

  /* ---------- 光点 ---------- */
  .sparks{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
  }
  .spark{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,230,235,0.95) 0%,rgba(255,143,163,0.7) 40%,rgba(255,59,92,0) 72%);
    animation:sparkFloat var(--beat) ease-out infinite;
    will-change:transform,opacity;
  }
  @keyframes sparkFloat{
    0%   {transform:translateY(0) scale(0.85); opacity:0.25;}
    14%  {transform:translateY(-7px) scale(1.25); opacity:0.95;}
    30%  {transform:translateY(-4px) scale(1); opacity:0.6;}
    55%  {transform:translateY(0) scale(0.9); opacity:0.4;}
    100% {transform:translateY(0) scale(0.85); opacity:0.25;}
  }

  /* ---------- 底部状态行 ---------- */
  .footer{
    position:absolute;
    bottom:6vh;
    left:0;
    right:0;
    z-index:6;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:0 20px;
    opacity:0;
    animation:subFade 1s ease-out 1.15s forwards;
  }

  .bpm-row{
    display:flex;
    align-items:baseline;
    gap:12px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    font-size:clamp(10px,1.05vw,12px);
    color:rgba(245,230,232,0.55);
  }
  .bpm-value{
    font-family:"Inter",system-ui,sans-serif;
    font-size:clamp(22px,2.6vw,30px);
    font-weight:600;
    letter-spacing:0.06em;
    color:var(--heart-light);
    text-shadow:0 0 18px rgba(255,59,92,0.5);
    font-variant-numeric:tabular-nums;
    transition:color .3s ease;
  }
  .bpm-value.hot{color:#ffd0d8;}

  .bpm-bar{
    width:clamp(120px,22vw,220px);
    height:2px;
    border-radius:2px;
    background:rgba(245,230,232,0.12);
    overflow:hidden;
    position:relative;
  }
  .bpm-fill{
    position:absolute;
    left:0;top:0;bottom:0;
    width:40%;
    border-radius:2px;
    background:linear-gradient(90deg,rgba(255,59,92,0.35),var(--heart-light));
    transition:width .45s cubic-bezier(.2,.8,.3,1);
  }

  .hint{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:clamp(10px,1.05vw,12px);
    letter-spacing:0.28em;
    color:rgba(245,230,232,0.45);
  }
  .key{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:52px;
    padding:4px 10px;
    border:1px solid rgba(245,230,232,0.22);
    border-radius:5px;
    font-size:10px;
    letter-spacing:0.16em;
    color:rgba(245,230,232,0.72);
    background:rgba(245,230,232,0.04);
  }
  .dot-sep{
    width:3px;height:3px;border-radius:50%;
    background:rgba(245,230,232,0.3);
  }

  /* ---------- 响应式 ---------- */
  @media (max-width:600px){
    .header{top:7vh;}
    .footer{bottom:5vh;gap:10px;}
    .hint{gap:8px;letter-spacing:0.2em;}
    .bpm-row{letter-spacing:0.22em;}
    .heart-zone{width:min(56vh,88vw);height:min(56vh,88vw);}
  }

  @media (prefers-reduced-motion:reduce){
    .bg-glow{animation-duration:calc(var(--beat) * 1.6);}
    .heart-wrap{animation:heartEnter 1s ease both;}
    .heart-wrap.manual{animation:heartEnter 1s ease both, manualBeat 0.6s ease;}
    .ring{animation-duration:calc(var(--beat) * 1.6);}
    .spark{animation-duration:calc(var(--beat) * 1.6);}
    .heart-svg .sheen{animation-duration:calc(var(--beat) * 1.6);}
    .noise{animation:none;}
  }
</style>
</head>
<body>

<div class="stage">
  <!-- 背景氛围层 -->
  <div class="bg-glow" id="bgGlow"></div>
  <svg class="noise" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#grain)"/>
  </svg>

  <!-- 顶部文字层 -->
  <header class="header">
    <h1 class="title" id="title" aria-label="跳动的心"></h1>
    <p class="subtitle">A Heart in the Dark</p>
  </header>

  <!-- 主体层 -->
  <div class="heart-zone" id="heartZone" role="button" tabindex="0" aria-label="点击或按空格键触发一次强搏">
    <div class="ring r1"></div>
    <div class="ring r2"></div>

    <div class="heart-wrap" id="heartWrap">
      <svg class="heart-svg" viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="heartGrad" cx="36%" cy="28%" r="78%">
            <stop offset="0%" stop-color="#ffb3c1"/>
            <stop offset="18%" stop-color="#ff8fa3"/>
            <stop offset="46%" stop-color="#ff3b5c"/>
            <stop offset="78%" stop-color="#c81f42"/>
            <stop offset="100%" stop-color="#7a1730"/>
          </radialGradient>
          <radialGradient id="heartSheen" cx="34%" cy="24%" r="42%">
            <stop offset="0%" stop-color="#fff2f4" stop-opacity="0.85"/>
            <stop offset="45%" stop-color="#ffd3db" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#ff8fa3" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="heartInner" cx="50%" cy="52%" r="60%">
            <stop offset="0%" stop-color="#ff3b5c" stop-opacity="0"/>
            <stop offset="72%" stop-color="#3a1f2b" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#1a0b14" stop-opacity="0.55"/>
          </radialGradient>
          <linearGradient id="heartRim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff8fa3" stop-opacity="0.75"/>
            <stop offset="50%" stop-color="#ff3b5c" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#3a1f2b" stop-opacity="0.85"/>
          </linearGradient>
        </defs>

        <path id="heartPath"
          d="M100 178
             C 78 156, 24 118, 12 84
             C 2 55, 16 26, 44 20
             C 66 15, 86 30, 100 50
             C 114 30, 134 15, 156 20
             C 184 26, 198 55, 188 84
             C 176 118, 122 156, 100 178 Z"
          fill="url(#heartGrad)"
          stroke="url(#heartRim)"
          stroke-width="2"/>

        <path d="M100 178
             C 78 156, 24 118, 12 84
             C 2 55, 16 26, 44 20
             C 66 15, 86 30, 100 50
             C 114 30, 134 15, 156 20
             C 184 26, 198 55, 188 84
             C 176 118, 122 156, 100 178 Z"
          fill="url(#heartInner)"/>

        <ellipse class="sheen" cx="66" cy="52" rx="30" ry="20"
          fill="url(#heartSheen)" transform="rotate(-28 66 52)"/>

        <path d="M52 40 C 66 30, 84 34, 92 46"
          fill="none" stroke="#fff0f3" stroke-opacity="0.5"
          stroke-width="3.2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="sparks" id="sparks"></div>
  </div>

  <!-- 底部状态行 -->
  <footer class="footer">
    <div class="bpm-row">
      <span>心率</span>
      <span class="bpm-value" id="bpmValue">72</span>
      <span>BPM</span>
    </div>
    <div class="bpm-bar"><div class="bpm-fill" id="bpmFill"></div></div>
    <div class="hint">
      <span class="key">空格</span>
      <span>或点击心形</span>
      <span class="dot-sep"></span>
      <span>触发一次强搏</span>
    </div>
  </footer>

  <div class="vignette"></div>
</div>

<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- 标题逐字入场 ---------- */
  var titleEl = document.getElementById("title");
  var titleText = "跳动的心";
  for (var i = 0; i < titleText.length; i++) {
    var s = document.createElement("span");
    s.textContent = titleText.charAt(i);
    s.style.animationDelay = (0.15 + i * 0.11) + "s";
    titleEl.appendChild(s);
  }

  /* ---------- 光点生成 ---------- */
  var sparksEl = document.getElementById("sparks");
  var sparkCount = window.innerWidth < 600 ? 14 : 22;
  var sparkData = [];
  for (var k = 0; k < sparkCount; k++) {
    var d = document.createElement("div");
    d.className = "spark";
    var size = 2 + Math.random() * 4.5;
    var angle = Math.random() * Math.PI * 2;
    var radius = 0.34 + Math.random() * 0.30;
    var cx = 50 + Math.cos(angle) * radius * 100;
    var cy = 50 + Math.sin(angle) * radius * 100;
    d.style.width = size + "px";
    d.style.height = size + "px";
    d.style.left = cx + "%";
    d.style.top = cy + "%";
    d.style.marginLeft = (-size / 2) + "px";
    d.style.marginTop = (-size / 2) + "px";
    d.style.animationDelay = (Math.random() * 1.6).toFixed(2) + "s";
    d.style.animationDuration = (1.6 + Math.random() * 0.5).toFixed(2) + "s";
    sparksEl.appendChild(d);
    sparkData.push(d);
  }

  /* ---------- BPM 逻辑 ---------- */
  var bpmValueEl = document.getElementById("bpmValue");
  var bpmFillEl = document.getElementById("bpmFill");
  var baseBpm = 72;
  var currentBpm = baseBpm;
  var targetBpm = baseBpm;
  var lastBump = 0;
  var bumpTimer = null;

  function renderBpm(v){
    var rounded = Math.round(v);
    bpmValueEl.textContent = rounded;
    var pct = Math.max(6, Math.min(100, (rounded - 50) / 90 * 100));
    bpmFillEl.style.width = pct + "%";
    if (rounded > 82) {
      bpmValueEl.classList.add("hot");
    } else {
      bpmValueEl.classList.remove("hot");
    }
  }

  function tickBpm(){
    currentBpm += (targetBpm - currentBpm) * 0.22;
    if (Math.abs(targetBpm - currentBpm) < 0.4) {
      currentBpm = targetBpm;
    }
    renderBpm(currentBpm);
    requestAnimationFrame(tickBpm);
  }

  function decayBpm(){
    var now = Date.now();
    if (now - lastBump > 1400) {
      targetBpm = Math.max(baseBpm, targetBpm - 5);
    }
    setTimeout(decayBpm, 420);
  }

  renderBpm(currentBpm);
  requestAnimationFrame(tickBpm);
  setTimeout(decayBpm, 1200);

  /* ---------- 手动强搏 ---------- */
  var heartWrap = document.getElementById("heartWrap");
  var bgGlow = document.getElementById("bgGlow");
  var heartZone = document.getElementById("heartZone");
  var manualCooldown = false;

  function manualBeat(){
    if (manualCooldown) return;
    manualCooldown = true;

    heartWrap.classList.remove("manual");
    // 强制重排以重启动画
    void heartWrap.offsetWidth;
    heartWrap.classList.add("manual");

    bgGlow.style.animation = "none";
    void bgGlow.offsetWidth;
    bgGlow.style.animation = "";

    // 光点同步上浮
    for (var i = 0; i < sparkData.length; i++) {
      var el = sparkData[i];
      el.style.animation = "none";
      void el.offsetWidth;
      el.style.animation = "";
    }

    lastBump = Date.now();
    targetBpm = Math.min(168, targetBpm + 16);
    renderBpm(currentBpm);

    setTimeout(function(){
      manualCooldown = false;
    }, 380);
  }

  heartZone.addEventListener("click", function(e){
    e.preventDefault();
    manualBeat();
  });

  heartZone.addEventListener("keydown", function(e){
    if (e.key === " " || e.key === "Spacebar" || e.code === "Space") {
      e.preventDefault();
      manualBeat();
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === " " || e.key === "Spacebar" || e.code === "Space") {
      // 避免页面滚动
      if (e.target === document.body || e.target === heartZone) {
        e.preventDefault();
      }
      manualBeat();
    }
  });

  /* ---------- 背景光晕与心跳同步（JS 微调，增强联动感） ---------- */
  if (!reduceMotion) {
    var beatStart = performance.now();
    var beatPeriod = 1600;
    function syncGlow(t){
      var phase = ((t - beatStart) % beatPeriod) / beatPeriod;
      var boost = 0;
      if (phase < 0.18) {
        boost = Math.sin(phase / 0.18 * Math.PI) * 0.10;
      } else if (phase > 0.32 && phase < 0.45) {
        boost = Math.sin((phase - 0.32) / 0.13 * Math.PI) * 0.045;
      }
      bgGlow.style.filter = "brightness(" + (1 + boost).toFixed(3) + ")";
      requestAnimationFrame(syncGlow);
    }
    requestAnimationFrame(syncGlow);
  }

  /* ---------- 窗口尺寸变化：光点重排（保持分布合理） ---------- */
  var resizeTimer = null;
  window.addEventListener("resize", function(){
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      // 光点使用百分比定位，无需重算；此处仅确保动画持续
      document.body.style.overflow = "hidden";
    }, 150);
  });

  /* ---------- localStorage 安全记录最高心率（可选增强，异常保护） ---------- */
  try {
    var stored = window.localStorage.getItem("heartPeakBpm");
    if (stored) {
      var peak = parseInt(stored, 10);
      if (!isNaN(peak) && peak > baseBpm) {
        targetBpm = Math.min(peak, 168);
      }
    }
  } catch (err) { /* 忽略存储异常 */ }

  setInterval(function(){
    try {
      var cur = Math.round(currentBpm);
      var prev = parseInt(window.localStorage.getItem("heartPeakBpm") || "0", 10);
      if (cur > prev) {
        window.localStorage.setItem("heartPeakBpm", String(cur));
      }
    } catch (err) { /* 忽略存储异常 */ }
  }, 3000);

})();
</script>
</body>
</html>
