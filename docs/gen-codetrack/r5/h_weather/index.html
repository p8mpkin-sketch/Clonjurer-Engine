<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五日天气卡片</title>
<style>
  :root{
    --card-deep:#0f1b26;
    --text-main:#e8eef2;
    --text-dim:#7f96a6;
    --warm:#f2b544;
    --cool:#5aa9d6;
    --line:rgba(255,255,255,.14);
    --sky-top:#16283a;
    --sky-bottom:#0a121b;
    --sky-accent:#2a4a66;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:#070d13;
    color:var(--text-main);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
    padding:clamp(14px,3vw,40px);
    -webkit-font-smoothing:antialiased;
  }

  /* ============ 背景氛围层 ============ */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(120% 80% at 20% 0%, #16283a 0%, transparent 55%),
      radial-gradient(100% 90% at 90% 100%, #12202e 0%, transparent 60%),
      linear-gradient(155deg,#0b141d 0%, #081018 45%, #050a10 100%);
    overflow:hidden;
  }
  .bg::before{
    content:"";
    position:absolute;
    inset:-10%;
    background-image:
      linear-gradient(rgba(127,150,166,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(127,150,166,.07) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse 90% 80% at 50% 45%, #000 20%, transparent 85%);
    -webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 45%, #000 20%, transparent 85%);
  }
  .clouds{
    position:absolute;
    inset:-20% -40%;
    background:
      radial-gradient(closest-side, rgba(90,169,214,.10), transparent 70%) 10% 30%/40% 40% no-repeat,
      radial-gradient(closest-side, rgba(242,181,68,.06), transparent 70%) 70% 20%/46% 36% no-repeat,
      radial-gradient(closest-side, rgba(127,150,166,.10), transparent 70%) 45% 80%/50% 40% no-repeat;
    animation:cloudDrift 24s linear infinite;
    filter:blur(6px);
  }
  @keyframes cloudDrift{
    0%{ transform:translateX(-3%) translateY(0); }
    50%{ transform:translateX(3%) translateY(-1.5%); }
    100%{ transform:translateX(-3%) translateY(0); }
  }

  /* ============ 主体卡片 ============ */
  .weather-card{
    position:relative;
    z-index:2;
    width:min(920px, 94vw);
    min-height:min(660px, 78vh);
    border-radius:26px;
    padding:clamp(18px,2.6vw,34px);
    display:flex;
    flex-direction:column;
    gap:clamp(12px,1.8vw,22px);
    background:
      linear-gradient(165deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,.85),
      0 2px 0 rgba(255,255,255,.05) inset,
      0 0 0 1px rgba(0,0,0,.4);
    transition:background .5s cubic-bezier(.4,0,.2,1), box-shadow .5s ease;
    overflow:hidden;
    opacity:0;
    transform:translateY(16px);
    animation:cardIn .6s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  @keyframes cardIn{
    to{ opacity:1; transform:translateY(0); }
  }
  /* 卡片顶部高光 */
  .weather-card::before{
    content:"";
    position:absolute;
    top:0; left:8%; right:8%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
    pointer-events:none;
  }
  /* 卡片内天空光晕 */
  .weather-card::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(90% 60% at 50% -10%, rgba(255,255,255,.10), transparent 60%);
    pointer-events:none;
    transition:opacity .5s ease;
  }

  /* ============ 头部 ============ */
  .card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    position:relative;
    z-index:2;
    flex-wrap:wrap;
  }
  .head-left{ display:flex; flex-direction:column; gap:6px; }
  .city{
    font-size:clamp(18px,2.4vw,22px);
    font-weight:600;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .city .pin{
    width:9px; height:9px;
    border-radius:50%;
    background:var(--warm);
    box-shadow:0 0 0 4px rgba(242,181,68,.16), 0 0 12px rgba(242,181,68,.7);
    animation:pinPulse 2.6s ease-in-out infinite;
  }
  @keyframes pinPulse{
    0%,100%{ box-shadow:0 0 0 4px rgba(242,181,68,.16), 0 0 10px rgba(242,181,68,.55); }
    50%{ box-shadow:0 0 0 7px rgba(242,181,68,.05), 0 0 18px rgba(242,181,68,.9); }
  }
  .subline{
    font-size:12px;
    font-weight:500;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .head-right{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .now-temp{
    display:flex;
    align-items:baseline;
    gap:2px;
    font-variant-numeric:tabular-nums;
  }
  .now-temp .num{
    font-size:clamp(30px,4.4vw,42px);
    font-weight:600;
    line-height:1;
    letter-spacing:-.02em;
    background:linear-gradient(180deg,#ffffff,#c3d3de);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .now-temp .unit{
    font-size:16px;
    font-weight:500;
    color:var(--text-dim);
  }
  .now-meta{
    display:flex;
    flex-direction:column;
    gap:3px;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:.03em;
  }
  .now-meta b{ color:var(--text-main); font-weight:600; }

  /* 单位切换 */
  .unit-toggle{
    display:flex;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    padding:3px;
    position:relative;
    cursor:pointer;
    user-select:none;
  }
  .unit-toggle .thumb{
    position:absolute;
    top:3px; left:3px;
    width:calc(50% - 3px);
    height:calc(100% - 6px);
    border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.10));
    box-shadow:0 2px 8px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.3) inset;
    transition:transform .3s cubic-bezier(.34,1.4,.64,1);
  }
  .unit-toggle[data-unit="F"] .thumb{ transform:translateX(100%); }
  .unit-toggle .opt{
    position:relative;
    z-index:1;
    width:44px;
    text-align:center;
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    padding:6px 0;
    color:var(--text-dim);
    transition:color .3s ease;
  }
  .unit-toggle[data-unit="C"] .opt[data-u="C"],
  .unit-toggle[data-unit="F"] .opt[data-u="F"]{ color:#fff; }

  /* ============ 五天列 ============ */
  .days{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:clamp(6px,1vw,14px);
    position:relative;
    z-index:2;
    flex:1 1 auto;
    min-height:0;
  }
  .day{
    position:relative;
    border-radius:16px;
    padding:clamp(10px,1.4vw,16px) clamp(6px,.8vw,10px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(6px,1vw,10px);
    cursor:pointer;
    border:1px solid transparent;
    background:rgba(255,255,255,.02);
    transition:background .3s ease, border-color .3s ease, transform .3s cubic-bezier(.34,1.3,.64,1), box-shadow .3s ease;
    will-change:transform;
    outline:none;
  }
  .day:hover, .day:focus-visible{
    background:rgba(255,255,255,.06);
    border-color:rgba(255,255,255,.16);
    transform:translateY(-3px) scale(1.035);
    box-shadow:0 14px 28px -14px rgba(0,0,0,.8);
  }
  .day.active{
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    border-color:rgba(255,255,255,.26);
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 18px 34px -18px rgba(0,0,0,.9);
  }
  .day.active::after{
    content:"";
    position:absolute;
    left:50%; bottom:-1px;
    width:26px; height:2px;
    transform:translateX(-50%);
    border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--warm), transparent);
  }
  .day-name{
    font-size:12px;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    transition:color .3s ease;
  }
  .day.active .day-name, .day:hover .day-name{ color:var(--text-main); }
  .day-date{
    font-size:11px;
    color:var(--text-dim);
    font-variant-numeric:tabular-nums;
    letter-spacing:.04em;
  }
  .icon-wrap{
    width:clamp(38px,5.4vw,52px);
    height:clamp(38px,5.4vw,52px);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .35s cubic-bezier(.34,1.4,.64,1);
  }
  .day:hover .icon-wrap, .day.active .icon-wrap{ transform:scale(1.12); }
  .icon-wrap svg{ width:100%; height:100%; overflow:visible; }
  .cond{
    font-size:clamp(11px,1.3vw,13px);
    font-weight:400;
    color:var(--text-main);
    opacity:.9;
    text-align:center;
    white-space:nowrap;
  }
  .temps{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-variant-numeric:tabular-nums;
    margin-top:auto;
  }
  .temps .hi{
    font-size:clamp(17px,2.3vw,24px);
    font-weight:600;
    color:var(--text-main);
    letter-spacing:-.01em;
  }
  .temps .lo{
    font-size:clamp(12px,1.5vw,15px);
    font-weight:500;
    color:var(--cool);
    opacity:.85;
  }

  /* ============ 曲线区 ============ */
  .chart-wrap{
    position:relative;
    z-index:2;
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .chart-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:500;
  }
  .legend{
    display:flex;
    gap:16px;
    text-transform:none;
    letter-spacing:.02em;
  }
  .legend span{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    color:var(--text-dim);
  }
  .legend i{
    width:14px; height:3px;
    border-radius:2px;
    display:inline-block;
  }
  .legend .hi-dot i{ background:var(--warm); box-shadow:0 0 8px rgba(242,181,68,.6); }
  .legend .lo-dot i{ background:var(--cool); box-shadow:0 0 8px rgba(90,169,214,.6); }

  .chart-box{
    position:relative;
    width:100%;
    height:clamp(96px,15vh,150px);
  }
  .chart-box svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }
  .grid-line{ stroke:rgba(127,150,166,.14); stroke-width:1; }
  .axis-label{
    fill:var(--text-dim);
    font-size:10px;
    font-family:inherit;
    font-variant-numeric:tabular-nums;
    letter-spacing:.04em;
  }
  .band{
    fill:url(#bandGrad);
    opacity:0;
    animation:bandIn .9s ease .5s forwards;
  }
  @keyframes bandIn{ to{ opacity:.16; } }

  .line-hi, .line-lo{
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-width:2.2;
    stroke-dasharray:var(--len);
    stroke-dashoffset:var(--len);
    animation:drawLine 1.2s ease-out .25s forwards;
  }
  .line-hi{ stroke:var(--warm); filter:drop-shadow(0 0 6px rgba(242,181,68,.45)); }
  .line-lo{ stroke:var(--cool); filter:drop-shadow(0 0 6px rgba(90,169,214,.4)); }
  @keyframes drawLine{ to{ stroke-dashoffset:0; } }

  .pt{
    r:4;
    transition:r .25s cubic-bezier(.34,1.5,.64,1), opacity .3s ease;
    opacity:0;
    animation:ptIn .4s ease 1.15s forwards;
    cursor:pointer;
  }
  @keyframes ptIn{ to{ opacity:1; } }
  .pt.hi{ fill:var(--warm); }
  .pt.lo{ fill:var(--cool); }
  .pt.halo{
    fill:none;
    stroke-width:1.2;
    opacity:0;
    transition:opacity .25s ease, r .25s ease;
  }
  .pt.halo.hi{ stroke:var(--warm); }
  .pt.halo.lo{ stroke:var(--cool); }
  .pt-group.hot .pt{ r:6.5; }
  .pt-group.hot .pt.halo{ opacity:.55; r:11; }

  .day-hover-line{
    stroke:rgba(255,255,255,.18);
    stroke-width:1;
    stroke-dasharray:3 4;
    opacity:0;
    transition:opacity .25s ease;
  }
  .day-hover-line.show{ opacity:1; }

  /* ============ 底部信息条 ============ */
  .foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:.04em;
    position:relative;
    z-index:2;
    padding-top:10px;
    border-top:1px solid var(--line);
    flex-wrap:wrap;
  }
  .foot .hint{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .foot .hint kbd{
    font-family:inherit;
    font-size:10px;
    padding:2px 6px;
    border-radius:5px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14);
    color:var(--text-main);
  }
  .foot .sky-name{
    color:var(--text-main);
    font-weight:600;
    letter-spacing:.06em;
  }

  /* 数字滚动 */
  .roll{
    display:inline-block;
    position:relative;
    overflow:hidden;
    vertical-align:bottom;
  }
  .roll .roller{
    display:block;
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }

  @media (max-width:640px){
    .weather-card{ border-radius:20px; min-height:auto; }
    .card-head{ gap:10px; }
    .head-right{ width:100%; justify-content:space-between; }
    .days{ gap:4px; }
    .day{ border-radius:12px; padding:10px 3px; gap:6px; }
    .cond{ font-size:10px; letter-spacing:-.02em; }
    .temps{ gap:3px; flex-direction:column; align-items:center; }
    .temps .lo{ font-size:11px; }
    .legend{ gap:10px; }
    .chart-head{ font-size:10px; }
  }
  @media (max-width:400px){
    .day-name{ font-size:10px; letter-spacing:.06em; }
    .day-date{ font-size:9px; }
  }

  @media (prefers-reduced-motion: reduce){
    .weather-card{ animation-duration:.01s; }
    .clouds{ animation:none; }
    .line-hi,.line-lo{ animation-duration:.01s; animation-delay:0s; }
    .band{ animation-duration:.01s; animation-delay:0s; }
    .pt{ animation-duration:.01s; animation-delay:0s; }
    .city .pin{ animation:none; }
    .day{ transition-duration:.1s; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="clouds"></div>
</div>

<main class="weather-card" id="card" aria-label="未来五天天气卡片">

  <!-- 头部 -->
  <header class="card-head">
    <div class="head-left">
      <div class="city"><span class="pin" aria-hidden="true"></span>杭州 · 西湖区</div>
      <div class="subline" id="subline">未来五日 · 示例数据</div>
    </div>
    <div class="head-right">
      <div class="now-temp">
        <span class="num" id="nowTemp">21</span>
        <span class="unit" id="nowUnit">°C</span>
      </div>
      <div class="now-meta">
        <span>当前 <b id="nowCond">多云</b></span>
        <span>湿度 <b id="nowHum">62%</b> · 风 <b id="nowWind">3 级</b></span>
      </div>
      <div class="unit-toggle" id="unitToggle" data-unit="C" role="switch" aria-label="切换温度单位" tabindex="0" aria-checked="false">
        <span class="thumb" aria-hidden="true"></span>
        <span class="opt" data-u="C">°C</span>
        <span class="opt" data-u="F">°F</span>
      </div>
    </div>
  </header>

  <!-- 五天列 -->
  <section class="days" id="days" aria-label="五天天气列表"></section>

  <!-- 曲线 -->
  <section class="chart-wrap">
    <div class="chart-head">
      <span>温度曲线</span>
      <div class="legend">
        <span class="hi-dot"><i></i>最高温</span>
        <span class="lo-dot"><i></i>最低温</span>
      </div>
    </div>
    <div class="chart-box" id="chartBox">
      <svg id="chart" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
  </section>

  <!-- 底部 -->
  <footer class="foot">
    <div class="hint">
      <kbd>←</kbd><kbd>→</kbd> 切换日期 · 点击卡片任意一天查看该日天空
    </div>
    <div>当前天空 <span class="sky-name" id="skyName">清晨</span></div>
  </footer>
</main>

<script>
(function(){
  "use strict";

  /* ================= 示例数据 ================= */
  // sky: 该日天空色调 [顶部色, 底部色, 光晕色]
  const DATA = [
    { key:"today", name:"今天", date:"03/12", cond:"晴",     icon:"sun",      hi:24, lo:13, hum:48, wind:"2 级", sky:["#1d3a52","#0c1a26","rgba(242,181,68,.16)"], skyName:"清晨" },
    { key:"d1",    name:"周四", date:"03/13", cond:"多云",   icon:"cloud",    hi:21, lo:12, hum:62, wind:"3 级", sky:["#243a4c","#0d1922","rgba(127,150,166,.18)"], skyName:"上午" },
    { key:"d2",    name:"周五", date:"03/14", cond:"小雨",   icon:"rain",     hi:18, lo:11, hum:84, wind:"4 级", sky:["#1b2f42","#0a1620","rgba(90,169,214,.16)"], skyName:"阴雨" },
    { key:"d3",    name:"周六", date:"03/15", cond:"雷阵雨", icon:"storm",    hi:16, lo:9,  hum:88, wind:"5 级", sky:["#2a2f3e","#0b1018","rgba(90,169,214,.14)"], skyName:"雷雨" },
    { key:"d4",    name:"周日", date:"03/16", cond:"晴间多云", icon:"suncloud", hi:22, lo:10, hum:55, wind:"2 级", sky:["#3a2f38","#120f16","rgba(242,181,68,.20)"], skyName:"黄昏" }
  ];

  const state = {
    unit: "C",
    selected: 0,
    hovered: -1
  };

  const card = document.getElementById("card");
  const daysEl = document.getElementById("days");
  const chart = document.getElementById("chart");
  const chartBox = document.getElementById("chartBox");
  const unitToggle = document.getElementById("unitToggle");
  const skyNameEl = document.getElementById("skyName");
  const sublineEl = document.getElementById("subline");
  const nowTempEl = document.getElementById("nowTemp");
  const nowUnitEl = document.getElementById("nowUnit");
  const nowCondEl = document.getElementById("nowCond");
  const nowHumEl = document.getElementById("nowHum");
  const nowWindEl = document.getElementById("nowWind");

  const SVGNS = "http://www.w3.org/2000/svg";

  /* ================= 温度换算 ================= */
  function conv(c){ return state.unit === "C" ? c : Math.round(c * 9 / 5 + 32); }
  function unitStr(){ return state.unit === "C" ? "°C" : "°F"; }

  /* ================= 图标 ================= */
  function iconSVG(type){
    const s = 'stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
    switch(type){
      case "sun":
        return `<svg viewBox="0 0 48 48" style="color:#f2b544">
          <circle cx="24" cy="24" r="8" fill="rgba(242,181,68,.18)" stroke="#f2b544" stroke-width="1.6"/>
          <circle cx="24" cy="24" r="8" ${s}/>
          <g ${s}>
            <line x1="24" y1="6" x2="24" y2="11"/>
            <line x1="24" y1="37" x2="24" y2="42"/>
            <line x1="6" y1="24" x2="11" y2="24"/>
            <line x1="37" y1="24" x2="42" y2="24"/>
            <line x1="11.3" y1="11.3" x2="14.8" y2="14.8"/>
            <line x1="33.2" y1="33.2" x2="36.7" y2="36.7"/>
            <line x1="36.7" y1="11.3" x2="33.2" y2="14.8"/>
            <line x1="14.8" y1="33.2" x2="11.3" y2="36.7"/>
          </g>
        </svg>`;
      case "cloud":
        return `<svg viewBox="0 0 48 48" style="color:#c3d3de">
          <path d="M14 33h20a7 7 0 0 0 0-14 9.5 9.5 0 0 0-18.2-2.6A7.2 7.2 0 0 0 14 33Z"
            fill="rgba(195,211,222,.14)" stroke="#c3d3de" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M18 26h14" ${s} opacity=".55"/>
        </svg>`;
      case "rain":
        return `<svg viewBox="0 0 48 48" style="color:#5aa9d6">
          <path d="M14 28h20a7 7 0 0 0 0-14 9.5 9.5 0 0 0-18.2-2.6A7.2 7.2 0 0 0 14 28Z"
            fill="rgba(90,169,214,.14)" stroke="#9fc4da" stroke-width="1.6" stroke-linejoin="round"/>
          <g stroke="#5aa9d6" stroke-width="1.8" stroke-linecap="round">
            <line x1="18" y1="33" x2="16" y2="39"/>
            <line x1="25" y1="33" x2="23" y2="39"/>
            <line x1="32" y1="33" x2="30" y2="39"/>
          </g>
        </svg>`;
      case "storm":
        return `<svg viewBox="0 0 48 48" style="color:#8fa6b6">
          <path d="M13 26h22a7 7 0 0 0 0-14 9.5 9.5 0 0 0-18.2-2.6A7.2 7.2 0 0 0 13 26Z"
            fill="rgba(143,166,182,.14)" stroke="#8fa6b6" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M25 29l-5 7h5l-2 6 7-8h-5l3-5z" fill="#f2b544" stroke="#f2b544" stroke-width="1" stroke-linejoin="round"/>
          <g stroke="#5aa9d6" stroke-width="1.6" stroke-linecap="round" opacity=".85">
            <line x1="16" y1="30" x2="14.5" y2="35"/>
            <line x1="35" y1="30" x2="33.5" y2="35"/>
          </g>
        </svg>`;
      case "suncloud":
      default:
        return `<svg viewBox="0 0 48 48" style="color:#f2b544">
          <circle cx="30" cy="16" r="6.5" fill="rgba(242,181,68,.18)" stroke="#f2b544" stroke-width="1.5"/>
          <g stroke="#f2b544" stroke-width="1.5" stroke-linecap="round">
            <line x1="30" y1="4" x2="30" y2="7.5"/>
            <line x1="40" y1="16" x2="43.5" y2="16"/>
            <line x1="37.1" y1="8.9" x2="39.6" y2="6.4"/>
          </g>
          <path d="M12 34h20a6.5 6.5 0 0 0 0-13 8.8 8.8 0 0 0-16.9-2.4A6.7 6.7 0 0 0 12 34Z"
            fill="rgba(195,211,222,.14)" stroke="#c3d3de" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>`;
    }
  }

  /* ================= 构建五天列 ================= */
  function buildDays(){
    daysEl.innerHTML = "";
    DATA.forEach((d, i) => {
      const el = document.createElement("div");
      el.className = "day" + (i === state.selected ? " active" : "");
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", `${d.name} ${d.date} ${d.cond} 最高${conv(d.hi)}${unitStr()} 最低${conv(d.lo)}${unitStr()}`);
      el.dataset.index = i;
      el.innerHTML = `
        <div class="day-name">${d.name}</div>
        <div class="day-date">${d.date}</div>
        <div class="icon-wrap">${iconSVG(d.icon)}</div>
        <div class="cond">${d.cond}</div>
        <div class="temps">
          <span class="hi roll" data-role="hi"><span class="roller">${conv(d.hi)}°</span></span>
          <span class="lo roll" data-role="lo"><span class="roller">${conv(d.lo)}°</span></span>
        </div>
      `;
      el.addEventListener("click", () => selectDay(i));
      el.addEventListener("mouseenter", () => setHover(i));
      el.addEventListener("mouseleave", () => setHover(-1));
      el.addEventListener("focus", () => setHover(i));
      el.addEventListener("blur", () => setHover(-1));
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " "){ e.preventDefault(); selectDay(i); }
      });
      daysEl.appendChild(el);
    });
  }

  /* ================= 曲线绘制 ================= */
  function drawChart(){
    const W = 1000, H = 200;
    const padX = 8, padTop = 26, padBottom = 26;
    const n = DATA.length;

    const allHi = DATA.map(d => conv(d.hi));
    const allLo = DATA.map(d => conv(d.lo));
    let maxV = Math.max(...allHi), minV = Math.min(...allLo);
    if (maxV === minV){ maxV += 1; minV -= 1; }
    // 留出余量
    const span = maxV - minV;
    maxV += span * 0.22;
    minV -= span * 0.22;

    const innerW = W - padX * 2;
    const innerH = H - padTop - padBottom;
    const stepX = innerW / (n - 1);

    const xOf = i => padX + stepX * i;
    const yOf = v => padTop + innerH * (1 - (v - minV) / (maxV - minV));

    // 坐标点
    const hiPts = DATA.map((d, i) => [xOf(i), yOf(conv(d.hi))]);
    const loPts = DATA.map((d, i) => [xOf(i), yOf(conv(d.lo))]);

    // 平滑曲线（Catmull-Rom 转贝塞尔）
    function smoothPath(pts){
      if (pts.length < 2) return "";
      let d = `M ${pts[0][0]} ${pts[0][1]}`;
      for (let i = 0; i < pts.length - 1; i++){
        const p0 = pts[i - 1] || pts[i];
        const p1 = pts[i];
        const p2 = pts[i + 1];
        const p3 = pts[i + 2] || p2;
        const t = 0.18;
        const c1x = p1[0] + (p2[0] - p0[0]) * t;
        const c1y = p1[1] + (p2[1] - p0[1]) * t;
        const c2x = p2[0] - (p3[0] - p1[0]) * t;
        const c2y = p2[1] - (p3[1] - p1[1]) * t;
        d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2[0]} ${p2[1]}`;
      }
      return d;
    }

    const hiPath = smoothPath(hiPts);
    const loPath = smoothPath(loPts);

    // 网格与纵轴标签（3 条）
    let grid = "";
    const gridCount = 3;
    for (let g = 0; g <= gridCount; g++){
      const v = minV + (maxV - minV) * (g / gridCount);
      const y = yOf(v);
      const label = Math.round(v);
      grid += `<line class="grid-line" x1="${padX}" y1="${y}" x2="${W - padX}" y2="${y}"/>`;
      grid += `<text class="axis-label" x="${W - padX}" y="${y - 5}" text-anchor="end">${label}${unitStr()}</text>`;
    }

    // 带（高低温之间）
    const bandPath = hiPath + ` L ${loPts[n-1][0]} ${loPts[n-1][1]} ` +
      smoothPath(loPts.slice().reverse()).replace(/^M/, "L") + " Z";

    // 点
    let ptsHTML = "";
    const hoverX = (state.hovered >= 0) ? xOf(state.hovered) : null;
    for (let i = 0; i < n; i++){
      const hot = (i === state.hovered);
      const cls = hot ? "pt-group hot" : "pt-group";
      ptsHTML += `<g class="${cls}" data-i="${i}">
        <circle class="pt halo hi" cx="${hiPts[i][0]}" cy="${hiPts[i][1]}" r="4"/>
        <circle class="pt halo lo" cx="${loPts[i][0]}" cy="${loPts[i][1]}" r="4"/>
        <circle class="pt hi" cx="${hiPts[i][0]}" cy="${hiPts[i][1]}" r="4"/>
        <circle class="pt lo" cx="${loPts[i][0]}" cy="${loPts[i][1]}" r="4"/>
      </g>`;
    }

    const hoverLine = `<line class="day-hover-line ${state.hovered >= 0 ? 'show' : ''}" x1="${hoverX ?? 0}" y1="${padTop - 12}" x2="${hoverX ?? 0}" y2="${H - padBottom + 12}"/>`;

    // 计算路径长度用于描边动画（用近似值：总直线长度 * 1.05）
    function approxLen(pts){
      let L = 0;
      for (let i = 1; i < pts.length; i++){
        L += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
      }
      return Math.ceil(L * 1.15);
    }
    const hiLen = approxLen(hiPts);
    const loLen = approxLen(loPts);

    chart.setAttribute("viewBox", `0 0 ${W} ${H}`);
    chart.innerHTML = `
      <defs>
        <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f2b544"/>
          <stop offset="100%" stop-color="#5aa9d6"/>
        </linearGradient>
      </defs>
      ${grid}
      <path class="band" d="${bandPath}"/>
      <path class="line-hi" d="${hiPath}" style="--len:${hiLen}px"/>
      <path class="line-lo" d="${loPath}" style="--len:${loLen}px"/>
      ${hoverLine}
      ${ptsHTML}
    `;

    // 点交互
    chart.querySelectorAll(".pt-group").forEach(g => {
      const i = parseInt(g.dataset.i, 10);
      g.style.pointerEvents = "none";
      g.querySelectorAll(".pt").forEach(c => { c.style.pointerEvents = "all"; });
      g.addEventListener("mouseenter", () => setHover(i));
      g.addEventListener("mouseleave", () => setHover(-1));
      g.addEventListener("click", () => selectDay(i));
    });
  }

  /* ================= 交互 ================= */
  function setHover(i){
    if (state.hovered === i) return;
    state.hovered = i;
    // 同步列高亮
    daysEl.querySelectorAll(".day").forEach((el, idx) => {
      el.classList.toggle("hovered", idx === i);
      if (idx === i){
        el.style.background = "rgba(255,255,255,.06)";
        el.style.borderColor = "rgba(255,255,255,.16)";
        el.style.transform = "translateY(-3px) scale(1.035)";
      } else if (!el.classList.contains("active")){
        el.style.background = "";
        el.style.borderColor = "";
        el.style.transform = "";
      }
    });
    // 更新曲线点
    chart.querySelectorAll(".pt-group").forEach(g => {
      g.classList.toggle("hot", parseInt(g.dataset.i, 10) === i);
    });
    const line = chart.querySelector(".day-hover-line");
    if (line){
      if (i >= 0){
        const W = 1000, padX = 8, n = DATA.length;
        const stepX = (W - padX * 2) / (n - 1);
        const x = padX + stepX * i;
        line.setAttribute("x1", x);
        line.setAttribute("x2", x);
        line.classList.add("show");
      } else {
        line.classList.remove("show");
      }
    }
  }

  function selectDay(i){
    if (i < 0 || i >= DATA.length) return;
    state.selected = i;
    const d = DATA[i];

    // 列状态
    daysEl.querySelectorAll(".day").forEach((el, idx) => {
      el.classList.toggle("active", idx === i);
      el.setAttribute("aria-pressed", idx === i ? "true" : "false");
    });

    // 卡片背景过渡
    card.style.setProperty("--sky-top", d.sky[0]);
    card.style.setProperty("--sky-bottom", d.sky[1]);
    card.style.background = `linear-gradient(165deg, ${d.sky[0]} 0%, ${d.sky[1]} 100%)`;
    card.style.boxShadow = `0 40px 80px -30px rgba(0,0,0,.85), 0 2px 0 rgba(255,255,255,.05) inset, 0 0 0 1px rgba(0,0,0,.4), 0 0 60px -20px ${d.sky[2]}`;

    // 头部概览
    nowCondEl.textContent = d.cond;
    nowHumEl.textContent = d.hum + "%";
    nowWindEl.textContent = d.wind;
    skyNameEl.textContent = d.skyName;
    sublineEl.textContent = `${d.name} · ${d.date} · 示例数据`;

    rollNumber(nowTempEl, conv(d.hi) - 3);
  }

  /* ================= 数字滚动 ================= */
  function rollNumber(el, target){
    // 使用两层数字做垂直滚动
    const from = parseInt(el.textContent, 10) || 0;
    if (from === target){ el.textContent = target; return; }
    el.style.transition = "none";
    el.style.transform = "translateY(0)";
    el.textContent = from;
    // 强制回流后过渡
    void el.offsetWidth;
    el.style.transition = "transform .3s cubic-bezier(.4,0,.2,1), opacity .3s ease";
    el.style.transform = "translateY(-8px)";
    el.style.opacity = "0";
    setTimeout(() => {
      el.textContent = target;
      el.style.transition = "none";
      el.style.transform = "translateY(8px)";
      void el.offsetWidth;
      el.style.transition = "transform .3s cubic-bezier(.4,0,.2,1), opacity .3s ease";
      el.style.transform = "translateY(0)";
      el.style.opacity = "1";
    }, 150);
  }

  function rollAllTemps(){
    daysEl.querySelectorAll(".day").forEach((el, i) => {
      const d = DATA[i];
      const hiEl = el.querySelector('[data-role="hi"] .roller');
      const loEl = el.querySelector('[data-role="lo"] .roller');
      animateRoller(hiEl, conv(d.hi));
      animateRoller(loEl, conv(d.lo));
      el.setAttribute("aria-label", `${d.name} ${d.date} ${d.cond} 最高${conv(d.hi)}${unitStr()} 最低${conv(d.lo)}${unitStr()}`);
    });
    nowUnitEl.textContent = unitStr();
    const cur = DATA[state.selected];
    rollNumber(nowTempEl, conv(cur.hi) - 3);
  }

  function animateRoller(el, target){
    if (!el) return;
    const from = parseInt(el.textContent, 10);
    if (from === target){ el.textContent = target + "°"; return; }
    el.style.transition = "none";
    el.style.transform = "translateY(0)";
    el.style.opacity = "1";
    void el.offsetWidth;
    el.style.transition = "transform .3s cubic-bezier(.4,0,.2,1), opacity .3s ease";
    el.style.transform = "translateY(-100%)";
    el.style.opacity = "0";
    setTimeout(() => {
      el.textContent = target + "°";
      el.style.transition = "none";
      el.style.transform = "translateY(100%)";
      void el.offsetWidth;
      el.style.transition = "transform .3s cubic-bezier(.4,0,.2,1), opacity .3s ease";
      el.style.transform = "translateY(0)";
      el.style.opacity = "1";
    }, 150);
  }

  /* ================= 单位切换 ================= */
  function toggleUnit(){
    state.unit = state.unit === "C" ? "F" : "C";
    unitToggle.dataset.unit = state.unit;
    unitToggle.setAttribute("aria-checked", state.unit === "F" ? "true" : "false");
    rollAllTemps();
    drawChart();
  }

  unitToggle.addEventListener("click", toggleUnit);
  unitToggle.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggleUnit(); }
  });

  /* ================= 键盘左右切换 ================= */
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight"){
      e.preventDefault();
      selectDay((state.selected + 1) % DATA.length);
    } else if (e.key === "ArrowLeft"){
      e.preventDefault();
      selectDay((state.selected - 1 + DATA.length) % DATA.length);
    }
  });

  /* ================= 初始化 ================= */
  function init(){
    buildDays();
    drawChart();
    selectDay(0);
    // 入场后短暂展示当前温度
    nowUnitEl.textContent = unitStr();
  }

  // 窗口尺寸变化时重绘曲线（保持 viewBox 自适应，但重新计算点位置以匹配容器）
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      drawChart();
    }, 120);
  });

  init();
})();
</script>
</body>
