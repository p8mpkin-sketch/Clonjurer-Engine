# 类型检查基线: `mypy` (仓库根目录) 须 0 错误, tests/test_typecheck.py 在装了 mypy 时守住它。
# 宽松起步(未注解函数体不查、可选类型不严格), 先让新代码不再引入明显的类型错误; 逐步收紧。
[mypy]
files = core, models.py, config.py, app.py
ignore_missing_imports = True
follow_imports = silent
no_strict_optional = True
disable_error_code = var-annotated, annotation-unchecked

# ClonerEngine 按职责拆出的 mixin: 方法里的 self.xxx 由组合后的 ClonerEngine 提供
[mypy-core.clone.capture,core.clone.download,core.clone.localize,core.clone.scoring]
disable_error_code = attr-defined, var-annotated, annotation-unchecked

# Pillow/numpy 自带的类型随版本变化大(本机与 CI 钉版不同), 一律按 Any 处理, 结果不随依赖版本漂移
[mypy-PIL,PIL.*,numpy,numpy.*]
follow_imports = skip
follow_imports_for_stubs = True
